# Runs on every push and pull request: style, lint, tests, and the two commands that need no training.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The CPU build of torch: the runner has no GPU, and the default Linux build is several times larger.
      - run: pip install -r requirements.txt ruff==0.17.5 pytest --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q
      - run: python bouncing_shapes.py
      - run: python plot_runs.py
